    <g class="heart-pulse">
      <path d="M190 200 C190 160 250 160 250 205 C250 245 190 275 190 275 C190 275 130 245 130 205 C130 160 190 160 190 200 Z" fill="url(#giantHeartGrad)" stroke="#FFFFFF" stroke-width="3.5" filter="url(#heartGlow)"/>
      <path d="M155 185 Q170 175 180 185" stroke="#FFAAA6" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="138" cy="215" rx="10" ry="8" fill="#FFE0CE" stroke="#3D2817" stroke-width="2"/>
      <ellipse cx="242" cy="215" rx="10" ry="8" fill="#FFE0CE" stroke="#3D2817" stroke-width="2"/>
      <text x="190" y="226" font-family="'Quicksand', sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle">Motu ❤️ Bhaiyoo</text>
