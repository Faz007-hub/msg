<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 340" width="100%" height="100%">
  <defs>
    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="giantHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="50%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#C9184A"/>
    </linearGradient>
  </defs>
  <style>
    .forever-float { animation: foreverBob 3s ease-in-out infinite alternate; transform-origin: center bottom; }
    .heart-pulse { animation: heartBeating 1.5s ease-in-out infinite; transform-origin: 190px 220px; }
    @keyframes foreverBob {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes heartBeating {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>

  <g class="forever-float">
    <g>
      <path d="M80 180 C60 190 50 220 50 280 C50 295 180 295 180 280 C180 220 170 190 150 180 Z" fill="#7EC8E3" stroke="#3D2817" stroke-width="3"/>
