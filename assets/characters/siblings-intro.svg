<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .plead-anim { animation: pleadBhai 2.5s ease-in-out infinite; transform-origin: 120px 250px; }
    .pout-anim { animation: poutMotu 3s ease-in-out infinite; transform-origin: 280px 250px; }
    @keyframes pleadBhai {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes poutMotu {
      0%, 100% { transform: translateY(0px) rotate(1deg); }
      50% { transform: translateY(-4px) rotate(-1deg); }
    }
  </style>

  <!-- Left: Bhaiyoo (Pleading) -->
  <g class="plead-anim">
    <path d="M80 180 C60 190 50 220 50 280 C50 295 190 295 190 280 C190 220 180 190 160 180 Z" fill="#7EC8E3" stroke="#3D2817" stroke-width="3"/>
    <ellipse cx="120" cy="230" rx="16" ry="14" fill="#FFE0CE" stroke="#3D2817" stroke-width="2.5"/>
    <path d="M112 225 C116 220 124 220 128 225" stroke="#3D2817" stroke-width="2" fill="none"/>

    <ellipse cx="120" cy="120" rx="48" ry="50" fill="#FFE0CE" stroke="#3D2817" stroke-width="3"/>
    <path d="M74 115 C70 70 95 55 120 55 C145 55 170 70 166 115 C160 85 145 70 120 70 C95 70 80 85 74 115 Z" fill="#4A2E18"/>
    <ellipse cx="72" cy="125" rx="8" ry="11" fill="#FFE0CE" stroke="#3D2817" stroke-width="2"/>
    <ellipse cx="168" cy="125" rx="8" ry="11" fill="#FFE0CE" stroke="#3D2817" stroke-width="2"/>
    <path d="M120 55 C118 40 108 30 114 26 C122 24 125 40 122 55 Z" fill="#4A2E18" stroke="#3D2817" stroke-width="2"/>
    <path d="M72 108 C75 80 100 65 120 65 C140 65 165 80 168 108 C155 90 145 90 138 98 C130 82 115 82 108 95 C100 88 85 92 72 108 Z" fill="#4A2E18" stroke="#3D2817" stroke-width="2"/>

    <path d="M92 105 Q100 98 108 103" stroke="#3D2817" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M148 105 Q140 98 132 103" stroke="#3D2817" stroke-width="3" stroke-linecap="round" fill="none"/>
    <ellipse cx="100" cy="120" rx="8" ry="11" fill="#2B170E"/>
    <circle cx="97" cy="116" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="140" cy="120" rx="8" ry="11" fill="#2B170E"/>
    <circle cx="137" cy="116" r="3.5" fill="#FFFFFF"/>
    <ellipse cx="88" cy="132" rx="9" ry="6" fill="#FFAAA6" opacity="0.8"/>
    <ellipse cx="152" cy="132" rx="9" ry="6" fill="#FFAAA6" opacity="0.8"/>
    <path d="M115 138 Q120 135 125 138" stroke="#C85A6A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="120" y="310" font-family="'Quicksand', sans-serif" font-weight="bold" font-size="14" fill="#33658A" text-anchor="middle">Bhaiyoo 🥺</text>
  </g>

  <!-- Right: Motu (Pouting) -->
  <g class="pout-anim">
    <path d="M220 185 C210 200 205 230 205 280 C205 295 355 295 355 280 C355 230 350 200 340 185 Z" fill="#FFADC6" stroke="#3D2817" stroke-width="3"/>
    <path d="M260 190 C265 210 295 210 300 190" fill="#FFF5F8" stroke="#FF758F" stroke-width="2"/>
    <path d="M280 205 C280 201 285 201 285 205 C285 208 280 212 280 212 C280 212 275 208 275 205 C275 201 280 201 280 205 Z" fill="#FF4D6D"/>
    <path d="M235 235 C255 245 305 245 325 235 C310 260 250 260 235 235 Z" fill="#FF94B2" stroke="#3D2817" stroke-width="2.5"/>

    <ellipse cx="280" cy="120" rx="48" ry="50" fill="#FFE0CE" stroke="#3D2817" stroke-width="3"/>
    <circle cx="230" cy="65" r="22" fill="#3A2012" stroke="#3D2817" stroke-width="2.5"/>
    <path d="M226 80 C220 75 220 85 226 82 C232 85 232 75 226 80 Z" fill="#FF6584"/>
    <circle cx="330" cy="65" r="22" fill="#3A2012" stroke="#3D2817" stroke-width="2.5"/>
    <path d="M334 80 C340 75 340 85 334 82 C328 85 328 75 334 80 Z" fill="#FF6584"/>

    <path d="M234 115 C230 70 255 55 280 55 C305 55 330 70 326 115 C320 85 305 70 280 70 C255 70 240 85 234 115 Z" fill="#3A2012"/>
    <path d="M232 105 C240 85 260 70 280 70 C300 70 320 85 328 105 C315 92 295 90 280 98 C265 90 245 92 232 105 Z" fill="#3A2012" stroke="#3D2817" stroke-width="2"/>

    <ellipse cx="232" cy="125" rx="7" ry="10" fill="#FFE0CE" stroke="#3D2817" stroke-width="2"/>
    <ellipse cx="328" cy="125" rx="7" ry="10" fill="#FFE0CE" stroke="#3D2817" stroke-width="2"/>

    <path d="M255 105 Q262 100 270 106" stroke="#3D2817" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M305 106 Q298 100 290 105" stroke="#3D2817" stroke-width="3" stroke-linecap="round" fill="none"/>

    <ellipse cx="264" cy="118" rx="8" ry="10" fill="#2B170E"/>
    <circle cx="261" cy="115" r="3" fill="#FFFFFF"/>
    <path d="M256 112 L252 110" stroke="#3D2817" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="296" cy="118" rx="8" ry="10" fill="#2B170E"/>
    <circle cx="293" cy="115" r="3" fill="#FFFFFF"/>
    <path d="M304 112 L308 110" stroke="#3D2817" stroke-width="1.5" stroke-linecap="round"/>

    <ellipse cx="252" cy="130" rx="9" ry="6" fill="#FFAAA6" opacity="0.85"/>
    <ellipse cx="308" cy="130" rx="9" ry="6" fill="#FFAAA6" opacity="0.85"/>
    <circle cx="280" cy="136" r="3.5" fill="#FF6584" stroke="#C85A6A" stroke-width="1.5"/>
    <text x="280" y="310" font-family="'Quicksand', sans-serif" font-weight="bold" font-size="14" fill="#C9184A" text-anchor="middle">Motu 😤</text>
  </g>

  <g style="animation: poutMotu 2s infinite alternate;">
    <path d="M190 85 C190 75 210 75 210 85 C210 95 190 95 190 85 Z" fill="#FFFFFF" stroke="#FF758F" stroke-width="1.5"/>
    <text x="200" y="88" font-size="14" text-anchor="middle">🥺</text>
  </g>
</svg>