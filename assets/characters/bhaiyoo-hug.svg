    <ellipse cx="132" cy="128" rx="11" ry="7" fill="#FFAAA6" opacity="0.85"/>
    <ellipse cx="208" cy="128" rx="11" ry="7" fill="#FFAAA6" opacity="0.85"/>
    <path d="M160 132 Q170 142 180 132" stroke="#C85A6A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>