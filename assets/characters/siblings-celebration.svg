<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="100%" height="100%">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .dance-bhai { animation: danceBhai 0.8s ease-in-out infinite alternate; transform-origin: 130px 250px; }
    .dance-motu { animation: danceMotu 0.8s ease-in-out infinite alternate 0.4s; transform-origin: 290px 250px; }
    @keyframes danceBhai {
      0% { transform: translateY(0px) rotate(-4deg); }
      100% { transform: translateY(-12px) rotate(4deg); }
    }
    @keyframes danceMotu {
      0% { transform: translateY(0px) rotate(4deg); }
      100% { transform: translateY(-12px) rotate(-4deg); }
    }
  </style>

