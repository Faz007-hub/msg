<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="100%" height="100%">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <style>
    .cake-bhai { animation: cakeBhaiBob 2.5s ease-in-out infinite alternate; transform-origin: center bottom; }
    @keyframes cakeBhaiBob {
      0% { transform: translateY(0px) rotate(-1deg); }
      100% { transform: translateY(-6px) rotate(1deg); }
    }
  </style>
