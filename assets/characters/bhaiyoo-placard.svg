<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ED3ED" />
      <stop offset="100%" stop-color="#6CB8D6" />
    </linearGradient>
    <linearGradient id="placardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5EC" />
      <stop offset="100%" stop-color="#FFB3C6" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0E6" />
      <stop offset="100%" stop-color="#FFE0CE" />
    </linearGradient>
  </defs>

  <style>
    .float-bhaiyoo { animation: bhaiyooFloat 3s ease-in-out infinite; transform-origin: center bottom; }
    .blink { animation: eyeBlink 4s infinite; transform-origin: center; }
    .sparkle { animation: sparklePulse 2s ease-in-out infinite; }
    .placard-bob { animation: placardBob 3s ease-in-out infinite alternate; }
    @keyframes bhaiyooFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-1deg); }
    }
    @keyframes eyeBlink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    @keyframes placardBob {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }
    @keyframes sparklePulse {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
    }
  </style>

  <!-- Floating Sparkles -->
  <g class="sparkle" style="transform-origin: 50px 70px;">
    <path d="M50 60 Q50 70 40 70 Q50 70 50 80 Q50 70 60 70 Q50 70 50 60 Z" fill="#FFD166" filter="url(#glow)"/>
  </g>
  <g class="sparkle" style="transform-origin: 270px 80px; animation-delay: 1s;">
    <path d="M270 70 Q270 80 260 80 Q270 80 270 90 Q270 80 280 80 Q270 80 270 70 Z" fill="#FF85A2" filter="url(#glow)"/>
  </g>

  <g class="float-bhaiyoo">
    <!-- Body / Hoodie -->
    <path d="M110 230 C90 240 75 270 75 330 C75 350 245 350 245 330 C245 270 230 240 210 230 Z" fill="url(#hoodieGrad)" stroke="#4A8FA8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M135 240 C145 270 175 270 185 240" fill="#FFF9F5" stroke="#4A8FA8" stroke-width="2"/>
    <!-- Hoodie Strings -->
    <path d="M145 248 Q140 275 142 290" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="142" cy="292" r="3" fill="#FFFFFF"/>
    <path d="M175 248 Q180 275 178 290" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="178" cy="292" r="3" fill="#FFFFFF"/>

    <!-- Head -->
    <ellipse cx="160" cy="155" rx="62" ry="65" fill="url(#skinGrad)" stroke="#3D2817" stroke-width="3"/>

    <!-- Hair Back/Base -->
    <path d="M98 150 C95 95 130 75 160 75 C190 75 225 95 222 150 C215 110 195 90 160 90 C125 90 105 110 98 150 Z" fill="#4A2E18"/>

    <!-- Ears -->
    <ellipse cx="98" cy="160" rx="10" ry="14" fill="#FFE0CE" stroke="#3D2817" stroke-width="2.5"/>
    <ellipse cx="98" cy="160" rx="5" ry="7" fill="#FFAAA6"/>
    <ellipse cx="222" cy="160" rx="10" ry="14" fill="#FFE0CE" stroke="#3D2817" stroke-width="2.5"/>
    <ellipse cx="222" cy="160" rx="5" ry="7" fill="#FFAAA6"/>

    <!-- Hair Bangs & Sprout Cowlick -->
    <path d="M160 75 C158 55 145 45 152 40 C162 38 166 58 162 75 Z" fill="#4A2E18" stroke="#3D2817" stroke-width="2"/>
    <path d="M160 75 C162 55 175 45 168 40 C158 38 154 58 158 75 Z" fill="#4A2E18" stroke="#3D2817" stroke-width="2"/>
    <path d="M96 140 C100 100 130 80 160 80 C190 80 220 100 224 140 C210 115 195 115 185 125 C175 105 155 105 145 120 C135 110 115 115 96 140 Z" fill="#4A2E18" stroke="#3D2817" stroke-width="2.5"/>

    <!-- Remorseful Eyebrows -->
    <path d="M125 135 Q135 128 145 133" stroke="#3D2817" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M195 135 Q185 128 175 133" stroke="#3D2817" stroke-width="3.5" stroke-linecap="round" fill="none"/>

    <!-- Big Expressive Chibi Eyes -->
    <g class="blink">
      <ellipse cx="135" cy="155" rx="10" ry="14" fill="#2B170E"/>
      <circle cx="132" cy="150" r="4.5" fill="#FFFFFF"/>
      <circle cx="138" cy="158" r="2" fill="#FFFFFF"/>
      <circle cx="142" cy="164" r="2.5" fill="#6CB8D6" opacity="0.8"/>

      <ellipse cx="185" cy="155" rx="10" ry="14" fill="#2B170E"/>
      <circle cx="182" cy="150" r="4.5" fill="#FFFFFF"/>
      <circle cx="188" cy="158" r="2" fill="#FFFFFF"/>
      <circle cx="178" cy="164" r="2.5" fill="#6CB8D6" opacity="0.8"/>
    </g>

    <!-- Blushing Cheeks -->
    <ellipse cx="120" cy="172" rx="12" ry="8" fill="#FFAAA6" opacity="0.85"/>
    <line x1="115" y1="170" x2="125" y2="174" stroke="#FF758F" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="200" cy="172" rx="12" ry="8" fill="#FFAAA6" opacity="0.85"/>
    <line x1="195" y1="170" x2="205" y2="174" stroke="#FF758F" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Small Apologetic Mouth -->
    <path d="M154 180 Q160 178 166 180" stroke="#C85A6A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Placard -->
    <g class="placard-bob" style="transform-origin: 160px 280px;">
      <rect x="156" y="290" width="8" height="80" rx="3" fill="#D4A373" stroke="#9C6644" stroke-width="2"/>
      <rect x="50" y="225" width="220" height="95" rx="16" fill="url(#placardGrad)" stroke="#FF758F" stroke-width="3.5" filter="url(#glow)"/>
      <rect x="56" y="231" width="208" height="83" rx="12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 4"/>
      <path d="M68 244 C68 238 75 238 75 244 C75 248 68 253 68 253 C68 253 61 248 61 244 C61 238 68 238 68 244 Z" fill="#FF4D6D"/>
      <path d="M252 244 C252 238 259 238 259 244 C259 248 252 253 252 253 C252 253 245 248 245 244 C245 238 252 238 252 244 Z" fill="#FF4D6D"/>

      <text x="160" y="265" font-family="'Quicksand', 'Nunito', 'Poppins', sans-serif" font-weight="900" font-size="24" fill="#C9184A" text-anchor="middle" letter-spacing="1.5">SORRY</text>
      <text x="160" y="296" font-family="'Quicksand', 'Nunito', 'Poppins', sans-serif" font-weight="900" font-size="27" fill="#800F2F" text-anchor="middle" letter-spacing="2">MOTU! ❤️</text>

      <ellipse cx="68" cy="272" rx="12" ry="10" fill="#FFE0CE" stroke="#3D2817" stroke-width="2.5"/>
      <ellipse cx="252" cy="272" rx="12" ry="10" fill="#FFE0CE" stroke="#3D2817" stroke-width="2.5"/>
    </g>
  </g>
</svg>